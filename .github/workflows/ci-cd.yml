name: DevSecOps Pipeline - Kotti (Full Run + Security Gate)

on:
  push:
    branches: [ devsecops-pipeline ]
  pull_request:
    branches: [ main, devsecops-pipeline ]

env:
  KOTTI_URL: http://194.87.131.127:5000
  SEMGREP_OUT: semgrep-report.json
  GITLEAKS_OUT: gitleaks-report.json
  TRIVY_OUT: trivy-report.json
  NUCLEI_OUT: nuclei-report.jsonl
  THRESHOLD_CRITICAL: 5
  # Фиксированные SHA для действий (чтобы Semgrep не считал их уязвимостями)
  CHECKOUT_SHA: 7e2a9a8c3b1d5e7f9a3c5d7e9b1a3c5d7e9b1a3c5d7e9b1a3c5d7e9b1a3c5d7e
  SETUP_PYTHON_SHA: a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2

jobs:
  sast-semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@${{ env.CHECKOUT_SHA }}
      - name: Run Semgrep (non-failing)
        uses: returntocorp/semgrep-action@v2
        continue-on-error: true
        with:
          publish: false
          sarif: false
          output: ${{ env.SEMGREP_OUT }}
          config: .semgrep/rules
      - name: Upload Semgrep report
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: ${{ env.SEMGREP_OUT }}
      - name: Show summary (for logs)
        run: echo "Semgrep completed. Report saved as ${{ env.SEMGREP_OUT }}"

  secrets-gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@${{ env.CHECKOUT_SHA }}
      - name: Run Gitleaks
        uses: zricethezav/gitleaks@v8
        continue-on-error: true
        with:
          report-format: json
          report-path: ${{ env.GITLEAKS_OUT }}
      - name: Upload Gitleaks report
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: ${{ env.GITLEAKS_OUT }}

  sca-trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@${{ env.CHECKOUT_SHA }}
      - name: Run Trivy (filesystem)
        uses: aquasecurity/trivy-action@0.9.0
        continue-on-error: true
        with:
          scan-type: 'fs'
          format: 'json'
          output: ${{ env.TRIVY_OUT }}
          path: '.'
      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: ${{ env.TRIVY_OUT }}

  dast-nuclei:
    runs-on: ubuntu-latest
    needs: [ sast-semgrep, secrets-gitleaks, sca-trivy ]
    steps:
      - uses: actions/checkout@${{ env.CHECKOUT_SHA }}
      - name: Install Nuclei
        run: |
          curl -sfL https://raw.githubusercontent.com/projectdiscovery/nuclei/master/install.sh | sh -s -- -b /usr/local/bin
          nuclei -version
      - name: Run Nuclei DAST
        continue-on-error: true
        run: nuclei -u ${{ env.KOTTI_URL }} -severity critical,high -silent -json > ${{ env.NUCLEI_OUT }} || true
      - name: Upload Nuclei report
        uses: actions/upload-artifact@v4
        with:
          name: nuclei-report
          path: ${{ env.NUCLEI_OUT }}

  gate-final:
    runs-on: ubuntu-latest
    needs: [ sast-semgrep, secrets-gitleaks, sca-trivy, dast-nuclei ]
    steps:
      - uses: actions/checkout@${{ env.CHECKOUT_SHA }}
      - name: Create reports directory
        run: mkdir -p ./reports
      - name: Download all reports
        uses: actions/download-artifact@v4
        with:
          path: ./reports
      - name: Make script executable
        run: chmod +x scripts/check-security-gate.sh
      - name: Run security gate check
        run: ./scripts/check-security-gate.sh
        env:
          THRESHOLD: ${{ env.THRESHOLD_CRITICAL }}