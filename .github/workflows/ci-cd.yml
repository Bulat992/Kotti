name: CI/CD for DevSecOps Diploma (SAST + SCA + Secrets + DAST)

on:
  push:
    branches: [ devsecops-pipeline ]
  pull_request:
    branches: [ main, devsecops-pipeline ]

jobs:
  build-and-security-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- 1. Python, зависимости и тесты ---
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install .
          fi
          pip install pytest mock gunicorn

      - name: Run tests
        run: pytest -c /dev/null test_example.py || true

      # --- 2. SAST: Semgrep ---
      - name: Install Semgrep
        run: pipx install semgrep

      - name: Run SAST with Semgrep
        continue-on-error: true
        # Флаг --force гарантирует запись JSON-отчета, даже если сканирование завершилось ошибкой
        run: |
          semgrep scan --config auto --json --output semgrep-result.json --force

      # --- 3. SCA: Trivy ---
      - name: Run Trivy SCA on filesystem
        continue-on-error: true
        # Передаем текущего пользователя хоста внутри Docker (--user), чтобы избежать ошибки 126
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "${{ github.workspace }}:/src" aquasec/trivy:0.49.1 \
            fs --severity CRITICAL,HIGH --format json --output /src/trivy-result.json /src

      # --- 4. Secret Detection: Gitleaks ---
      - name: Scan secrets with Gitleaks
        continue-on-error: true
        # Запуск от текущего пользователя + корректный путь сохранения отчета
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "${{ github.workspace }}:/repo" zricethezav/gitleaks:v8.18.2 \
            detect --source=/repo --severity HIGH --report-path=/repo/gitleaks-result.json

      # --- 5. DAST: Nuclei ---
      - name: Start Application for DAST
        run: |
          python -m gunicorn app:app --bind 127.0.0.1:5000 & 
          sleep 5

      - name: Run DAST with Nuclei
        continue-on-error: true
        # Запуск от текущего пользователя, отчет сохраняется напрямую в примонтированную папку
        run: |
          docker run --rm --net=host --user "$(id -u):$(id -g)" -v "${{ github.workspace }}:/output" projectdiscovery/nuclei:v3.1.8 \
            -target http://127.0.0.1:5000 -severity critical,high -json-export /output/nuclei-result.json

      # --- 6. Финальная агрегация результатов ---
      - name: Check Security Gate
        if: always()
        run: |
          echo "=== Анализ результатов безопасности ==="
          FAILED=0

          # Показываем содержимое для отладки в консоли GitHub Actions
          ls -la *-result.json || true

          # Проверка Semgrep: ищем непустой массив "results" в JSON
          if [ -f semgrep-result.json ] && grep -q '"results": *\[[^]]' semgrep-result.json 2>/dev/null; then
            echo "❌ SAST (Semgrep): Найдены уязвимости в коде!"
            FAILED=1
          else
            echo "✅ SAST (Semgrep): Проверка пройдена."
          fi

          # Проверка Trivy: ищем непустой массив "Vulnerabilities"
          if [ -f trivy-result.json ] && grep -q '"Vulnerabilities": *\[[^]]' trivy-result.json 2>/dev/null; then
            echo "❌ SCA (Trivy): Найдены уязвимости в зависимостях!"
            FAILED=1
          else
            echo "✅ SCA (Trivy): Проверка пройдена."
          fi

          # Проверка Gitleaks: утилита создает валидный JSON-массив, если секреты найдены (размер файла > 5 байт)
          if [ -s gitleaks-result.json ] && [ $(wc -c < gitleaks-result.json) -gt 5 ]; then
            echo "❌ Secrets (Gitleaks): Обнаружены утечки секретов!"
            FAILED=1
          else
            echo "✅ Secrets (Gitleaks): Проверка пройдена."
          fi

          # Проверка Nuclei: файл создается только при наличии уязвимостей
          if [ -s nuclei-result.json ]; then
            echo "❌ DAST (Nuclei): Найдены уязвимости в запущенном приложении!"
            FAILED=1
          else
            echo "✅ DAST (Nuclei): Проверка пройдена."
          fi

          # Финальный вердикт
          if [ $FAILED -ne 0 ]; then
            echo "🔴 Пайплайн принудительно остановлен из-за критических уязвимостей безопасности."
            exit 1
          else
            echo "🟢 Все проверки безопасности успешно пройдены!"
          fi

      # --- 7. Сохранение артефактов (Отчеты можно скачать из интерфейса GitHub) ---
      - name: Upload Security Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secops-diploma-reports
          path: |
            semgrep-result.json
            trivy-result.json
            gitleaks-result.json
            nuclei-result.json
          if-no-files-found: ignore