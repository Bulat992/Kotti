name: DevSecOps Pipeline - Kotti (Verified & Stable)

on:
  push:
    branches: [ devsecops-pipeline ]
  pull_request:
    branches: [ main, devsecops-pipeline ]
  workflow_dispatch:

env:
  KOTTI_URL: http://194.87.131.127:5000
  THRESHOLD_CRITICAL: 5

jobs:
  sast-semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep (non-failing)
        uses: semgrep/semgrep-action@v1
        continue-on-error: true
        with:
          config: p/ci
          # Генерируем стандартный SARIF-отчет, который нативно поддерживается экшеном
          generateSarif: "1"
          
      - name: Rename and Move Semgrep Report
        if: always()
        run: |
          if [ -f "semgrep.sarif" ]; then
            mv semgrep.sarif semgrep-report.json
          else
            echo "{}" > semgrep-report.json
          fi
          
      - name: Upload Semgrep report
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep-report.json

  secrets-gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          
      - name: Rename and Move Gitleaks Report
        if: always()
        run: |
          # gitleaks-action по умолчанию генерирует файл результатов в корень с именем результаты.json/gitleaks-report.json или через дефолтный стейдж
          if [ -f "gitleaks-report.json" ]; then
            echo "Report found"
          elif [ -f "results.json" ]; then
            mv results.json gitleaks-report.json
          else
            echo "[]" > gitleaks-report.json
          fi
          
      - name: Upload Gitleaks report
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json

  sca-trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy (filesystem)
        uses: aquasecurity/trivy-action@v0.35.0
        continue-on-error: true
        with:
          scan-type: 'fs'
          format: 'json'
          output: 'trivy-report.json'
          scan-ref: '.'
          
      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.json

  dast-nuclei:
    runs-on: ubuntu-latest
    needs: [ sast-semgrep, secrets-gitleaks, sca-trivy ]
    steps:
      - uses: actions/checkout@v4
      - name: Run Nuclei DAST via CLI
        continue-on-error: true
        run: |
          docker run --rm -v ${{ github.workspace }}:/output projectdiscovery/nuclei:latest -u ${{ env.KOTTI_URL }} -severity critical,high -silent -json -o /output/nuclei-report.jsonl || true
          
      - name: Upload Nuclei report
        uses: actions/upload-artifact@v4
        with:
          name: nuclei-report
          path: nuclei-report.jsonl

  gate-final:
    runs-on: ubuntu-latest
    needs: [ sast-semgrep, secrets-gitleaks, sca-trivy, dast-nuclei ]
    steps:
      - uses: actions/checkout@v4
      - name: Create reports directory
        run: mkdir -p ./reports
      - name: Download all reports
        uses: actions/download-artifact@v4
        with:
          path: ./reports
      - name: Make script executable
        run: chmod +x scripts/check-security-gate.sh
      - name: Run security gate check
        run: ./scripts/check-security-gate.sh
        env:
          THRESHOLD: ${{ env.THRESHOLD_CRITICAL }}