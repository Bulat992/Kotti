name: CI/CD for DevSecOps Diploma

on:
  push:
    branches: [ devsecops-pipeline ]
  pull_request:
    branches: [ main, devsecops-pipeline ]

jobs:
  build-and-test-and-sast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install .
          fi
          pip install pytest mock

      - name: Run our tests (isolated from project config)
        # -c /dev/null отключает чтение pytest.ini, чтобы избежать конфликтов плагинов
        run: pytest -c /dev/null test_example.py

      - name: Install Semgrep
        run: pipx install semgrep

      - name: Run Semgrep SAST scan
        run: semgrep scan --config auto --error
        # --config auto: используем встроенные правила Semgrep (поиск SQLi, XSS, hardcoded secrets и т.п.)
        # --error: если найдены проблемы уровня ERROR/CRITICAL — пайплайн падает (exit code 1)