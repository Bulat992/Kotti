name: CI/CD for DevSecOps Diploma (SAST + SCA + Secrets)

on:
  push:
    branches: [ devsecops-pipeline ]
  pull_request:
    branches: [ main, devsecops-pipeline ]

jobs:
  build-and-security-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- Python и тесты ---
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install .
          fi
          pip install pytest mock

      - name: Run tests
        run: pytest -c /dev/null test_example.py || true

      # --- SAST: Semgrep (через pipx, без GitHub Action) ---
      # Это решает ошибку "unable to find version v2"
      - name: Install Semgrep
        run: pipx install semgrep

      - name: Run SAST with Semgrep
        # --error делает пайплайн красным при нахождении уязвимостей — это правильно для диплома
        run: semgrep scan --config auto --error

      # --- SCA: Trivy (через официальный Docker-образ) ---
      - name: Run Trivy SCA on filesystem
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" aquasec/trivy:2.12.0 \
            fs --exit-code 1 --severity CRITICAL,HIGH /src

      # --- Secret Detection: Gitleaks (через официальный Docker-образ) ---
      - name: Scan secrets with Gitleaks
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" zricethezav/gitleaks:v9.1.0 \
            detect -source=/repo --severity HIGH --exit-code 1