
name: CI/CD for DevSecOps Diploma (SAST + SCA + Secrets)

on:
  push:
    branches: [ devsecops-pipeline ]
  pull_request:
    branches: [ main, devsecops-pipeline ]

jobs:
  build-and-security-checks:
    runs-on: ubuntu-latest

    steps:
      # ✅ Безопасный checkout (GitHub сам подставит SHA для v4)
      - name: Checkout code
        uses: actions/checkout@v4

      # ✅ Безопасная установка Python (GitHub сам подставит SHA для v5)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install .
          fi
          pip install pytest mock

      - name: Run our tests (isolated)
        run: pytest -c /dev/null test_example.py || true

      # --- SAST: Semgrep (код) ---
      - name: Install Semgrep
        run: pipx install semgrep

      - name: Run SAST with Semgrep
        # Политика fail-fast: если есть ERROR — пайплайн падает
        run: semgrep scan --config auto --error

      # --- SCA: Trivy (зависимости) — через официальный Action (рабочий) ---
      - name: Run Trivy SCA
        uses: aquasecurity/trivy-action@0.13.0
        with:
          image-ref: '.'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: 'true'
          severity: 'CRITICAL,HIGH'

      # --- Secret Detection: Gitleaks (секреты) — через официальный Action (рабочий) ---
      - name: Scan for secrets with Gitleaks
        uses: gitleaks/gitleaks-action@v9.0.0
        with:
          severity: HIGH
          exit-code: 1