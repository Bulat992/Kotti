name: CI/CD for DevSecOps Diploma (SAST + SCA + Secrets + DAST)

on:
  push:
    branches: [ devsecops-pipeline ]
  pull_request:
    branches: [ main, devsecops-pipeline ]

jobs:
  build-and-security-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- 1. Python, зависимости и тесты ---
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install .
          fi
          pip install pytest mock gunicorn # Добавили gunicorn для запуска DAST

      - name: Run tests
        run: pytest -c /dev/null test_example.py || true

      # --- 2. SAST: Semgrep ---
      - name: Install Semgrep
        run: pipx install semgrep

      - name: Run SAST with Semgrep
        # continue-on-error: true позволяет пайплайну идти дальше при падении шага
        continue-on-error: true
        # Сохраняем результат в JSON для последующего анализа скриптом
        run: |
          semgrep scan --config auto --json --output=semgrep-result.json --error

      # --- 3. SCA: Trivy ---
      - name: Run Trivy SCA on filesystem
        continue-on-error: true
        # Используем актуальную и стабильную версию Trivy. Результат пишем в JSON.
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" aquasec/trivy:0.49.1 \
            fs --exit-code 1 --severity CRITICAL,HIGH --format json --output /src/trivy-result.json /src

      # --- 4. Secret Detection: Gitleaks ---
      - name: Scan secrets with Gitleaks
        continue-on-error: true
        # Добавляем флаг --report-path для генерации отчета
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" zricethezav/gitleaks:v8.18.2 \
            detect --source=/repo --severity HIGH --exit-code 1 --report-path=/repo/gitleaks-result.json

      # --- 5. DAST: Nuclei (Замена ZAP) ---
      - name: Start Application for DAST
        # Запускаем ваше приложение (например, на Flask/Django) в фоновом режиме
        # Измените команду под ваш проект (например: python app.py или gunicorn)
        run: |
          python -m gunicorn app:app --bind 127.0.0.1:5000 & 
          sleep 5 # Даем приложению время на запуск

      - name: Run DAST with Nuclei
        continue-on-error: true
        # Сканируем локально запущенное приложение официальным Docker-образом Nuclei
        run: |
          docker run --rm --net=host -v "${{ github.workspace }}:/output" projectdiscovery/nuclei:v3.1.8 \
            -target http://127.0.0.1:5000 -severity critical,high -json-export /output/nuclei-result.json

      # --- 6. Финальная агрегация результатов ---
      - name: Check Security Gate
        # Этот шаг выполняется всегда, даже если предыдущие шаги завершились с ошибкой
        if: always()
        run: |
          echo "=== Анализ результатов безопасности ==="
          FAILED=0

          # Проверка Semgrep
          if [ -f semgrep-result.json ] && jq -e '.results | length > 0' semgrep-result.json > /dev/null; then
            echo "❌ SAST (Semgrep): Найдены уязвимости!"
            FAILED=1
          else
            echo "✅ SAST (Semgrep): Уязвимостей не обнаружено."
          fi

          # Проверка Trivy
          if [ -f trivy-result.json ] && jq -e '.Results[].Vulnerabilities | length > 0' trivy-result.json > /dev/null; then
            echo "❌ SCA (Trivy): Найдены уязвимости в зависимостях!"
            FAILED=1
          else
            echo "✅ SCA (Trivy): Зависимости чисты."
          fi

          # Проверка Gitleaks
          # Gitleaks создает пустой файл или не создает его, если секретов нет. 
          # Если файл не пустой (размер > 0) — секреты найдены.
          if [ -s gitleaks-result.json ]; then
            echo "❌ Secrets (Gitleaks): Обнаружены утечки секретов!"
            FAILED=1
          else
            echo "✅ Secrets (Gitleaks): Секретов в коде не найдено."
          fi

          # Проверка Nuclei
          if [ -s nuclei-result.json ]; then
            echo "❌ DAST (Nuclei): Найдены уязвимости в запущенном приложении!"
            FAILED=1
          else
            echo "✅ DAST (Nuclei): DAST сканирование успешно пройдено."
          fi

          # Финальный вердикт
          if [ $FAILED -ne 0 ]; then
            echo "🔴 Пайплайн остановлен из-за критических уязвимостей безопасности."
            exit 1
          else
            echo "🟢 Все проверки безопасности успешно пройдены!"
          fi

      # --- 7. Сохранение артефактов (Опционально) ---
      - name: Upload Security Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secops-diploma-reports
          path: |
            semgrep-result.json
            trivy-result.json
            gitleaks-result.json
            nuclei-result.json