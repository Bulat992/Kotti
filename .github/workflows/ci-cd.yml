name: CI/CD for DevSecOps Diploma

on:
  push:
    branches: [ devsecops-pipeline ]
  pull_request:
    branches: [ devsecops-pipeline ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install .
          fi
          # Добавляем всё, что нужно для запуска тестов Kotti
          pip install pytest mock pytest-flake8 pytest-cov

      - name: Run tests
        run: pytest