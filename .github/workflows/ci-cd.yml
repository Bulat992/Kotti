name: CI/CD for DevSecOps Diploma (SAST + SCA + Secrets + DAST)

on:
  push:
    branches: [ devsecops-pipeline ]
  pull_request:
    branches: [ main, devsecops-pipeline ]

jobs:
  # 1. Тестирование приложения
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install .
          fi
          pip install pytest mock

      - name: Run tests
        run: pytest -c /dev/null test_example.py || true

  # 2. Сканирование SAST (Semgrep)
  sast-semgrep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Semgrep
        run: pipx install semgrep

      # Ошибка исправлена: лишний текст "Pentesting" удален, шаг оформлен правильно
      - name: Run SAST with Semgrep
        run: |
          semgrep scan --config auto --error > semgrep-report.txt 2>&1 || echo "failed" > semgrep-status.txt

      - name: Upload Semgrep Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-artifacts
          path: |
            semgrep-report.txt
            semgrep-status.txt
          if-no-files-found: ignore

  # 3. Сканирование SCA (Trivy)
  sca-trivy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy SCA on filesystem
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" aquasec/trivy:2.12.0 \
            fs --exit-code 1 --severity CRITICAL,HIGH /src > trivy-report.txt 2>&1 || echo "failed" > trivy-status.txt

      - name: Upload Trivy Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trivy-artifacts
          path: |
            trivy-report.txt
            trivy-status.txt
          if-no-files-found: ignore

  # 4. Поиск секретов (Gitleaks)
  secrets-gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Scan secrets with Gitleaks
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" zricethezav/gitleaks:v9.1.0 \
            detect -source=/repo --severity HIGH --exit-code 1 > gitleaks-report.txt 2>&1 || echo "failed" > gitleaks-status.txt

      - name: Upload Gitleaks Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-artifacts
          path: |
            gitleaks-report.txt
            gitleaks-status.txt
          if-no-files-found: ignore

  # 5. Динамическое сканирование DAST (Nuclei)
  dast-nuclei:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Nuclei DAST Scan
        run: |
          docker run --rm -v "${{ github.workspace }}:/app" projectdiscovery/nuclei:v3.1.0 \
            -u http://localhost:8000 -severity high,critical -fail > nuclei-report.txt 2>&1 || echo "failed" > nuclei-status.txt

      - name: Upload Nuclei Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuclei-artifacts
          path: |
            nuclei-report.txt
            nuclei-status.txt
          if-no-files-found: ignore

  # 6. Финальная агрегация и вывод отчетов в консоль
  pipeline-gatekeeper:
    runs-on: ubuntu-latest
    needs: [ tests, sast-semgrep, sca-trivy, secrets-gitleaks, dast-nuclei ]
    if: always()
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Display Reports and Verify Security Status
        run: |
          FAILED=0

          echo "===================================================="
          echo "📊 СБОР И ВЫВОД ОТЧЕТОВ БЕЗОПАСНОСТИ"
          echo "===================================================="
          
          echo -e "\n🔍 [1/4] ОТЧЕТ SAST: SEMGREP"
          echo "----------------------------------------------------"
          if [ -f semgrep-artifacts/semgrep-report.txt ]; then
            cat semgrep-artifacts/semgrep-report.txt
          else
            echo "Файл отчета Semgrep отсутствует."
          fi
          if [ -f semgrep-artifacts/semgrep-status.txt ]; then FAILED=1; fi
          
          echo -e "\n📦 [2/4] ОТЧЕТ SCA: TRIVY"
          echo "----------------------------------------------------"
          if [ -f trivy-artifacts/trivy-report.txt ]; then
            cat trivy-artifacts/trivy-report.txt
          else
            echo "Файл отчета Trivy отсутствует."
          fi
          if [ -f trivy-artifacts/trivy-status.txt ]; then FAILED=1; fi
          
          echo -e "\n🔑 [3/4] ОТЧЕТ SECRETS: GITLEAKS"
          echo "----------------------------------------------------"
          if [ -f gitleaks-artifacts/gitleaks-report.txt ]; then
            cat gitleaks-artifacts/gitleaks-report.txt
          else
            echo "Файл отчета Gitleaks отсутствует."
          fi
          if [ -f gitleaks-artifacts/gitleaks-status.txt ]; then FAILED=1; fi

          echo -e "\n🌐 [4/4] ОТЧЕТ DAST: NUCLEI"
          echo "----------------------------------------------------"
          if [ -f nuclei-artifacts/nuclei-report.txt ]; then
            cat nuclei-artifacts/nuclei-report.txt
          else
            echo "Файл отчета Nuclei отсутствует."
          fi
          if [ -f nuclei-artifacts/nuclei-status.txt ]; then FAILED=1; fi

          echo -e "\n===================================================="
          echo "⚖️ ИТОГОВЫЙ ВЕРДИКТ КОНВЕЙЕРА"
          echo "===================================================="
          if [ $FAILED -ne 0 ]; then
            echo "❌ Безопасность нарушена! В логах выше присутствуют критические уязвимости."
            echo "Конвейер остановлен."
            exit 1
          else
            echo "✅ Все проверки успешно пройдены! Проект соответствует требованиям безопасности."
          fi