name: CI/CD for DevSecOps Diploma (SAST + SCA + Secrets + DAST)

on:
  push:
    branches: [ devsecops-pipeline ]
  pull_request:
    branches: [ main, devsecops-pipeline ]

jobs:
  build-and-security-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Важно для Gitleaks, чтобы он видел историю коммитов

      # --- 1. Python, зависимости и тесты ---
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install .
          fi
          pip install pytest mock gunicorn

      - name: Run tests
        run: pytest -c /dev/null test_example.py || true

      # --- 2. SAST: Semgrep ---
      - name: Install Semgrep
        run: pipx install semgrep

      - name: Run SAST with Semgrep
        continue-on-error: true
        # Убираем --error, добавляем явный вывод в файл. Semgrep сам создаст нужный JSON.
        run: |
          semgrep scan --config auto --json --output=semgrep-result.json

      # --- 3. SCA: Trivy ---
      - name: Run Trivy SCA on filesystem
        continue-on-error: true
        # Запуск под root, чтобы гарантировать создание файла, права исправим ниже
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" aquasec/trivy:0.49.1 \
            fs --severity CRITICAL,HIGH --format json --output /src/trivy-result.json /src

      # --- 4. Secret Detection: Gitleaks ---
      - name: Scan secrets with Gitleaks
        continue-on-error: true
        # Переопределяем entrypoint, чтобы принудительно сказать Git, что папка /repo безопасна
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" --entrypoint /bin/sh zricethezav/gitleaks:v8.18.2 \
            -c "git config --global --add safe.directory /repo && gitleaks detect --source=/repo --severity HIGH --report-path=/repo/gitleaks-result.json"

      # --- 5. DAST: Nuclei ---
      - name: Start Application for DAST
        run: |
          python -m gunicorn app:app --bind 127.0.0.1:5000 & 
          sleep 5

      - name: Run DAST with Nuclei
        continue-on-error: true
        run: |
          docker run --rm --net=host -v "${{ github.workspace }}:/output" projectdiscovery/nuclei:v3.1.8 \
            -target http://127.0.0.1:5000 -severity critical,high -json-export /output/nuclei-result.json

      # --- 6. Финальная агрегация результатов ---
      - name: Check Security Gate
        if: always()
        run: |
          echo "=== Исправление прав на отчеты ==="
          # Docker создал файлы под root. Возвращаем права текущему пользователю runner, чтобы шаги GitHub Actions увидели файлы.
          sudo chmod -R 777 ${{ github.workspace }}/*-result.json 2>/dev/null || true

          echo "=== Анализ результатов безопасности ==="
          FAILED=0

          # Проверка Semgrep
          if [ -f semgrep-result.json ] && grep -q '"results": *\[[^]]' semgrep-result.json 2>/dev/null; then
            echo "❌ SAST (Semgrep): Найдены уязвимости в коде!"
            FAILED=1
          else
            echo "✅ SAST (Semgrep): Проверка пройдена."
          fi

          # Проверка Trivy
          if [ -f trivy-result.json ] && grep -q '"Vulnerabilities": *\[[^]]' trivy-result.json 2>/dev/null; then
            echo "❌ SCA (Trivy): Найдены уязвимости в зависимостях!"
            FAILED=1
          else
            echo "✅ SCA (Trivy): Проверка пройдена."
          fi

          # Проверка Gitleaks
          if [ -s gitleaks-result.json ] && [ $(wc -c < gitleaks-result.json) -gt 5 ]; then
            echo "❌ Secrets (Gitleaks): Обнаружены утечки секретов!"
            FAILED=1
          else
            echo "✅ Secrets (Gitleaks): Проверка пройдена."
          fi

          # Проверка Nuclei
          if [ -s nuclei-result.json ]; then
            echo "❌ DAST (Nuclei): Найдены уязвимости в запущенном приложении!"
            FAILED=1
          else
            echo "✅ DAST (Nuclei): Проверка пройдена."
          fi

          # Финальный вердикт
          if [ $FAILED -ne 0 ]; then
            echo "🔴 Пайплайн принудительно остановлен из-за критических уязвимостей безопасности."
            exit 1
          else
            echo "🟢 Все проверки безопасности успешно пройдены!"
          fi

      # --- 7. Сохранение артефактов ---
      - name: Upload Security Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secops-diploma-reports
          path: |
            semgrep-result.json
            trivy-result.json
            gitleaks-result.json
            nuclei-result.json
          if-no-files-found: warn