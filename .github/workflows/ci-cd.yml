name: CI/CD for DevSecOps Diploma

on:
  push:
    branches: [ devsecops-pipeline ]
  pull_request:
    branches: [ devsecops-pipeline ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          if (Test-Path requirements.txt) { pip install -r requirements.txt }
          else { pip install . }

      - name: Run tests
        run: pytest