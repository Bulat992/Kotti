
name: CI/CD for DevSecOps Diploma (SAST + SCA + Secrets)

on:
  push:
    branches: [ devsecops-pipeline ]
  pull_request:
    branches: [ main, devsecops-pipeline ]

jobs:
  build-and-security-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install .
          fi
          pip install pytest mock

      - name: Run tests
        run: pytest -c /dev/null test_example.py || true

      # --- SAST: Semgrep ---
      - name: Install Semgrep
        run: pipx install semgrep

      - name: Run SAST with Semgrep
        # Это должно упасть (красный пайплайн) — это нормально и нужно для диплома
        run: semgrep scan --config auto --error

      # --- SCA: Trivy (через безопасный скрипт) ---
      - name: Install Trivy
        run: |
          curl -fsSL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Run Trivy SCA on filesystem
        run: trivy fs --exit-code 1 --severity CRITICAL,HIGH .

      # --- Secret Detection: Gitleaks ---
      - name: Install Gitleaks
        run: |
          curl -sSL https://raw.githubusercontent.com/gitleaks/gitleaks/master/install.sh | bash

      - name: Scan secrets with Gitleaks
        run: gitleaks detect --severity HIGH --exit-code 1