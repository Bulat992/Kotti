name: DevSecOps Pipeline - Kotti (Verified & Stable)

on:
  push:
    branches: [ devsecops-pipeline ]
  pull_request:
    branches: [ main, devsecops-pipeline ]
  workflow_dispatch:

env:
  KOTTI_URL: http://194.87.131.127:5000
  SEMGREP_OUT: semgrep-report.json
  GITLEAKS_OUT: gitleaks-report.json
  TRIVY_OUT: trivy-report.json
  NUCLEI_OUT: nuclei-report.jsonl
  THRESHOLD_CRITICAL: 5

jobs:
  sast-semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep (non-failing)
        uses: semgrep/semgrep-action@v1
        continue-on-error: true
        with:
          config: p/ci
          # Передаем аргументы вывода строго через блок args, как требует CLI
          args: --json --output=${{ env.SEMGREP_OUT }}
          
      - name: Ensure Semgrep report exists
        if: always()
        run: |
          if [ ! -f "${{ env.SEMGREP_OUT }}" ]; then
            echo "{}" > ${{ env.SEMGREP_OUT }}
          fi
          
      - name: Upload Semgrep report
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: ${{ env.SEMGREP_OUT }}

  secrets-gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          
      - name: Rename and Move Gitleaks Report
        if: always()
        run: |
          if [ -f "gitleaks-results.sarif" ]; then
            mv gitleaks-results.sarif ${{ env.GITLEAKS_OUT }}
          elif [ -f "results.json" ]; then
            mv results.json ${{ env.GITLEAKS_OUT }}
          elif [ ! -f "${{ env.GITLEAKS_OUT }}" ]; then
            echo "[]" > ${{ env.GITLEAKS_OUT }}
          fi
          
      - name: Upload Gitleaks report
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: ${{ env.GITLEAKS_OUT }}

  sca-trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy (filesystem)
        uses: aquasecurity/trivy-action@v0.35.0
        continue-on-error: true
        with:
          scan-type: 'fs'
          format: 'json'
          output: ${{ env.TRIVY_OUT }}
          scan-ref: '.'
          
      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: ${{ env.TRIVY_OUT }}

  dast-nuclei:
    runs-on: ubuntu-latest
    needs: [ sast-semgrep, secrets-gitleaks, sca-trivy ]
    steps:
      - uses: actions/checkout@v4
      - name: Run Nuclei DAST via CLI (with Root permissions)
        continue-on-error: true
        run: |
          # Запуск под пользователем root (--user root) решает проблему записи отчета на хост-систему ранера
          docker run --rm --user root -v ${{ github.workspace }}/:/output projectdiscovery/nuclei:latest -u ${{ env.KOTTI_URL }} -severity critical,high -silent -json -o /output/${{ env.NUCLEI_OUT }} || true
          
      - name: Upload Nuclei report
        uses: actions/upload-artifact@v4
        with:
          name: nuclei-report
          path: ${{ env.NUCLEI_OUT }}

  gate-final:
    runs-on: ubuntu-latest
    needs: [ sast-semgrep, secrets-gitleaks, sca-trivy, dast-nuclei ]
    steps:
      - uses: actions/checkout@v4
      - name: Create reports directory
        run: mkdir -p ./reports
      - name: Download all reports
        uses: actions/download-artifact@v4
        with:
          path: ./reports
      - name: Make script executable
        run: chmod +x scripts/check-security-gate.sh
      - name: Run security gate check
        run: ./scripts/check-security-gate.sh
        env:
          THRESHOLD: ${{ env.THRESHOLD_CRITICAL }}