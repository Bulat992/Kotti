name: CI/CD for DevSecOps Diploma

on:
  push:
    branches: [ devsecops-pipeline ]
  pull_request:
    branches: [ main, devsecops-pipeline ]

jobs:
  build-and-security-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install .
          fi
          pip install pytest mock

      - name: Run our tests (isolated)
        run: pytest -c /dev/null test_example.py

      # --- SAST: Semgrep (поиск уязвимостей в коде) ---
      - name: Install Semgrep
        run: pipx install semgrep

      - name: Run SAST with Semgrep
        # Политика fail-fast: если есть ERROR — пайплайн падает
        run: semgrep scan --config auto --error

      # --- SCA: Trivy (поиск CVE в зависимостях) ---
      - name: Install Trivy
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Run SCA with Trivy (dependencies)
        # Сканируем всю файловую систему проекта, смотрим только CRITICAL и HIGH
        run: trivy fs --exit-code 1 --severity CRITICAL,HIGH .

      # --- Secret Detection: Gitleaks (поиск секретов) ---
      - name: Install Gitleaks
        run: curl -sSL https://raw.githubusercontent.com/gitleaks/gitleaks/master/install.sh | sudo bash

      - name: Scan for secrets with Gitleaks
        # Ищем секреты в файлах и истории Git
        run: gitleaks detect --severity HIGH --exit-code 1