name: DevSecOps Pipeline - Kotti (Verified & Stable)

on:
  push:
    branches: [ devsecops-pipeline ]
  pull_request:
    branches: [ main, devsecops-pipeline ]

env:
  KOTTI_URL: http://194.87.131.127:5000
  SEMGREP_OUT: semgrep-report.json
  GITLEAKS_OUT: gitleaks-report.json
  TRIVY_OUT: trivy-report.json
  NUCLEI_OUT: nuclei-report.jsonl
  THRESHOLD_CRITICAL: 5

jobs:
  sast-semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep (non-failing)
        uses: semgrep/semgrep-action@v1
        continue-on-error: true
        with:
          config: p/ci
          # Используем переменную GITHUB_WORKSPACE, чтобы отчет лег в корень ранера
          args: --json --output=${{ github.workspace }}/${{ env.SEMGREP_OUT }}
          
      - name: Upload Semgrep report
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: ${{ github.workspace }}/${{ env.SEMGREP_OUT }}

  secrets-gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        with:
          # Официальный экшен gitleaks принимает путь через параметр report-path напрямую
          report-path: ${{ github.workspace }}/${{ env.GITLEAKS_OUT }}
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          
      - name: Upload Gitleaks report
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: ${{ github.workspace }}/${{ env.GITLEAKS_OUT }}

  sca-trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy (filesystem)
        uses: aquasecurity/trivy-action@v0.35.0
        continue-on-error: true
        with:
          scan-type: 'fs'
          format: 'json'
          output: ${{ github.workspace }}/${{ env.TRIVY_OUT }}
          scan-ref: '.'
          
      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: ${{ github.workspace }}/${{ env.TRIVY_OUT }}

  dast-nuclei:
    runs-on: ubuntu-latest
    needs: [ sast-semgrep, secrets-gitleaks, sca-trivy ]
    container:
      image: projectdiscovery/nuclei:latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Nuclei DAST
        continue-on-error: true
        run: nuclei -u ${{ env.KOTTI_URL }} -severity critical,high -silent -json > ${{ github.workspace }}/${{ env.NUCLEI_OUT }} || true
      - name: Upload Nuclei report
        uses: actions/upload-artifact@v4
        with:
          name: nuclei-report
          path: ${{ github.workspace }}/${{ env.NUCLEI_OUT }}

  gate-final:
    runs-on: ubuntu-latest
    needs: [ sast-semgrep, secrets-gitleaks, sca-trivy, dast-nuclei ]
    steps:
      - uses: actions/checkout@v4
      - name: Create reports directory
        run: mkdir -p ./reports
      - name: Download all reports
        uses: actions/download-artifact@v4
        with:
          path: ./reports
      - name: Make script executable
        run: chmod +x scripts/check-security-gate.sh
      - name: Run security gate check
        run: ./scripts/check-security-gate.sh
        env:
          THRESHOLD: ${{ env.THRESHOLD_CRITICAL }}