name: CI/CD for DevSecOps Diploma (SAST + SCA + Secrets)

on:
  push:
    branches: [ devsecops-pipeline ]
  pull_request:
    branches: [ main, devsecops-pipeline ]

jobs:
  build-and-security-checks:
    runs-on: ubuntu-latest

    steps:
      # ✅ Безопасный checkout с фиксированным SHA
      - name: Checkout code
        uses: actions/checkout@8f4b7f84864484a7bf31766abe9204da3cbe65b3

      # ✅ Безопасная установка Python с фиксированным SHA
      - name: Set up Python
        uses: actions/setup-python@d2cb0a7dc9a358ae3988e05fe70e536c2d6e77e2
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install .
          fi
          pip install pytest mock

      - name: Run our tests (isolated)
        run: pytest -c /dev/null test_example.py

      # --- SAST: Semgrep (код) ---
      - name: Install Semgrep
        run: pipx install semgrep

      - name: Run SAST with Semgrep
        # Политика fail-fast: если есть ERROR — пайплайн падает
        run: semgrep scan --config auto --error

      # --- SCA: Trivy (зависимости) — безопасный GitHub Action ---
      - name: Run Trivy SCA
        uses: aquasecurity/trivy-action@1593329556844503078
        with:
          image-ref: '.'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: 'true'
          severity: 'CRITICAL,HIGH'

      # --- Secret Detection: Gitleaks (секреты) — безопасный GitHub Action ---
      - name: Scan for secrets with Gitleaks
        uses: gitleaks/gitleaks-action@v8.16.0
        with:
          severity: HIGH
          exit-code: 1