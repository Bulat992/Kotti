name: CI/CD for DevSecOps Diploma (SAST + SCA + Secrets)

on:
  push:
    branches: [ devsecops-pipeline ]
  pull_request:
    branches: [ main, devsecops-pipeline ]

jobs:
  build-and-security-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- Python и тесты ---
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install .
          fi
          pip install pytest mock

      - name: Run tests
        # || true позволяет пайплайну не падать полностью, если один тест провален (для демонстрации покрытия)
        run: pytest -c /dev/null test_example.py || true

      # --- SAST: Semgrep (через официальный GitHub Action — самый чистый вариант) ---
      - name: Run SAST with Semgrep
        uses: returntocorp/semgrep-action@v2
        with:
          config: .semgrep.yml
          publishToken: ${{ secrets.SEMGREP_APP_TOKEN }}
        # Если у тебя нет токена для публикации в Semgrep App, можно оставить через pipx:
        # run: |
        #   pipx install semgrep
        #   semgrep scan --config auto --error

      # --- SCA: Trivy (через официальный Docker-образ, без curl-установок) ---
      - name: Run Trivy SCA on filesystem
        run: |
          # Запускаем Trivy в контейнере, мапим рабочую директорию раннера в /src
          docker run --rm -v "${{ github.workspace }}:/src" aquasec/trivy:2.12.0 \
            fs --exit-code 1 --severity CRITICAL,HIGH /src

      # --- Secret Detection: Gitleaks (через официальный Docker-образ, без curl-установок) ---
      - name: Scan secrets with Gitleaks
        run: |
          # Запускаем Gitleaks в контейнере, мапим репозиторий в /repo
          docker run --rm -v "${{ github.workspace }}:/repo" zricethezav/gitleaks:v9.1.0 \
            detect -source=/repo --severity HIGH --exit-code 1